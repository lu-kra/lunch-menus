name: Update menus

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 05:17, 08:17, 10:17, 14:17 and 17:17 UTC.
    - cron: "17 5,8,10,14,17 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - name: Scrape menus (+ AI fitness tips)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # AI results of the previous deployment, so each dish/image is sent to the model only once
          AI_CACHE_URL: ${{ steps.pages.outputs.base_url }}/ai.json
        run: python3 server.py --build _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
