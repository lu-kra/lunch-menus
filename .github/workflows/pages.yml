name: Update menus

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 30 min on weekdays, 05:00–12:30 UTC (≈ 6:00–14:30 Slovak time, winter & summer)
    - cron: "*/30 5-12 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Scrape menus
        run: python3 server.py --build _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
