<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obedové menu</title>
<style>
  :root { --bg:#f4f2ee; --card:#fff; --ink:#222; --muted:#777; --accent:#d9480f; --line:#e9e6e1; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:5; background:rgba(255,255,255,.96); border-bottom:1px solid var(--line); box-shadow:0 2px 12px rgba(34,24,16,.06); padding:12px 20px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; backdrop-filter:blur(12px); }
  h1 { font-size:20px; margin:0 12px 0 0; }
  .tabs { display:flex; gap:4px; }
  .tabs button { border:1px solid var(--line); background:#faf9f7; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:14px; transition:background .15s, color .15s, border-color .15s; }
  .tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tabs button.today:not(.active) { border-color:var(--accent); }
  input[type=search] { padding:7px 10px; border:1px solid #ddd; border-radius:8px; min-width:200px; font-size:14px; }
  .spacer { flex:1; }
  .meta { font-size:12px; color:var(--muted); }
  #refresh { border:1px solid #ddd; background:#fff; border-radius:8px; padding:6px 10px; cursor:pointer; }
  .dashboard { display:grid; grid-template-columns:minmax(280px, 340px) minmax(0, 1fr); gap:20px; align-items:start; padding:18px 20px 32px; }
  .dashboard-sidebar { display:grid; gap:12px; min-width:0; }
  .restaurants { min-width:0; }
  #pick { padding:10px 12px; background:#fff4e6; border:1px solid #ffd8a8; border-radius:10px; font-size:13px; display:none; }
  #pick, #week-plan, #ai { width:100%; max-width:none; margin:0; }
  #week-plan { padding:12px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 2px 8px rgba(34,24,16,.04); }
  #week-plan h2 { margin:0 0 8px; font-size:16px; }
  #week-plan .plan-day { display:grid; grid-template-columns:76px minmax(0, 1fr); gap:6px; align-items:start; padding:7px 0; border-top:1px solid #f1f3f5; font-size:12px; }
  #week-plan .plan-day > button:first-child { border:0; background:none; padding:3px 0; text-align:left; font:inherit; cursor:pointer; }
  #week-plan .plan-choice { display:flex; align-items:flex-start; gap:5px; min-width:0; }
  #week-plan .plan-choice > span { min-width:0; overflow-wrap:anywhere; }
  #week-plan .plan-day .none { color:var(--muted); }
  #week-plan .remove { flex:none; border:1px solid #ddd; border-radius:6px; background:#fff; cursor:pointer; padding:2px 5px; font-size:11px; }
  .restaurants-toolbar { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0; }
  .restaurants-toolbar h2 { margin:0; font-size:17px; }
  .rail-controls { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
  .rail-controls button { width:32px; height:32px; border:1px solid #ddd7cf; border-radius:50%; background:#fff; color:var(--ink); font-size:18px; line-height:1; cursor:pointer; }
  .rail-controls button:hover { background:#fff4e6; border-color:#ffd8a8; }
  main { display:flex; flex-wrap:nowrap; gap:12px; padding:10px 2px 16px; align-items:flex-start; overflow-x:auto; overscroll-behavior-x:contain; scroll-snap-type:x proximity; scrollbar-color:#c8c0b5 transparent; scrollbar-width:thin; }
  main::-webkit-scrollbar { height:10px; }
  main::-webkit-scrollbar-thumb { background:#c8c0b5; border:3px solid var(--bg); border-radius:8px; }
  .card { flex:0 0 300px; width:300px; min-width:270px; max-width:min(320px, calc(100vw - 40px)); scroll-snap-align:start; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 3px 12px rgba(34,24,16,.06); overflow:hidden; }
  .card h2 { margin:0; padding:10px 12px; font-size:15px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#fff,#fdfcfb); }
  .card h2 a { color:inherit; text-decoration:none; }
  .card h2 small { font-weight:normal; font-size:12px; color:var(--muted); }
  .warn, .err, .empty { margin:10px 16px; padding:8px 10px; border-radius:8px; font-size:13px; }
  .warn { background:#fff9db; color:#8a6d00; }
  .err { background:#ffe3e3; color:#c92a2a; }
  .empty { color:var(--muted); }
  ul { list-style:none; margin:0; padding:4px 0; }
  li { display:grid; grid-template-columns:64px minmax(0, 1fr) auto; gap:4px 7px; padding:8px 10px; border-bottom:1px solid #f6f6f6; cursor:pointer; }
  li:hover { background:#fafafa; }
  li.picked { background:#fff4e6; }
  li .cat { font-size:11px; color:var(--muted); text-transform:uppercase; padding-top:3px; overflow-wrap:anywhere; }
  li .name { font-size:14px; line-height:1.35; }
  li .sub { display:block; font-size:12px; color:var(--muted); margin-top:2px; }
  li .price { font-weight:600; white-space:nowrap; font-size:14px; }
  li.soup .name { font-style:italic; }
  li.perm { opacity:.75; }
  mark { background:#ffe066; padding:0 1px; }
  .imgs { padding:10px; }
  .imgs img { width:100%; border-radius:8px; display:block; cursor:zoom-in; }
  .imgs .hint { font-size:12px; color:var(--muted); margin:4px 2px 8px; }
  #loading { padding:40px; text-align:center; color:var(--muted); grid-column:1/-1; }
  #ai { padding:10px 12px 8px; background:#fff; border:1px solid #b2f2bb; border-radius:12px; box-shadow:0 2px 8px rgba(34,24,16,.04); display:none; }
  #ai h3 { margin:0 0 4px; font-size:15px; }
  #ai .row { display:grid; grid-template-columns:24px 1fr auto; gap:0 8px; align-items:start; padding:7px 4px; border-top:1px solid #f1f3f5; cursor:pointer; font-size:14px; }
  #ai .row:hover { background:#f8f9fa; }
  #ai .row.picked { background:#fff4e6; }
  #ai .why { display:block; font-size:12px; color:#555; margin-top:1px; }
  #ai .disc { font-size:11px; color:var(--muted); margin-top:6px; line-height:1.4; }
  .macros { display:block; font-size:12px; color:#2b8a3e; margin-top:2px; font-style:normal; }
  .score { display:inline-block; min-width:24px; padding:1px 6px; border-radius:10px; background:#adb5bd; color:#fff; font-size:11px; font-weight:600; text-align:center; }
  .score.hi { background:#2f9e44; }
  .score.mid { background:#f59f00; }
  li.best { background:#ebfbee; box-shadow:inset 3px 0 0 #2f9e44; opacity:1; }
  li.best.picked { background:#fff4e6; }
  .badge { font-size:11px; font-weight:600; color:#2b8a3e; white-space:nowrap; margin-left:6px; font-style:normal; }
  .ai-note { margin:10px 16px 0; font-size:12px; color:var(--muted); }
  details.orig summary { cursor:pointer; font-size:13px; color:var(--muted); padding:8px 16px; }
  details.orig .imgs { padding-top:0; }
  @media (max-width:900px) { .dashboard { grid-template-columns:1fr; } .dashboard-sidebar { grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items:start; } #pick { grid-column:1/-1; } }
  @media (max-width:600px) { header { padding:10px; } .dashboard { padding:12px 10px 24px; gap:18px; } .rail-controls > span { display:none; } .card { flex-basis:min(300px, calc(100vw - 40px)); width:min(300px, calc(100vw - 40px)); } }
</style>
</head>
<body>
<header>
  <h1>🍽️ Obedové menu</h1>
  <div class="tabs" id="tabs"></div>
  <input type="search" id="q" placeholder="Hľadať jedlo… (napr. rezeň, kurac)">
  <span class="spacer"></span>
  <span class="meta" id="meta"></span>
  <button id="refresh" title="Znovu načítať z webov">⟳ Obnoviť</button>
</header>
<div class="dashboard">
  <aside class="dashboard-sidebar">
    <div id="pick"></div>
    <section id="week-plan" aria-label="Týždenný plán obedov"></section>
    <div id="ai"></div>
  </aside>
  <section class="restaurants" aria-labelledby="restaurants-title">
    <div class="restaurants-toolbar"><h2 id="restaurants-title">Menu reštaurácií</h2><div class="rail-controls"><span>Posuňte pre ďalšie</span><button id="scroll-left" aria-label="Posunúť reštaurácie doľava">‹</button><button id="scroll-right" aria-label="Posunúť reštaurácie doprava">›</button></div></div>
    <main id="list"><div id="loading">Načítavam menu…</div></main>
  </section>
</div>

<script>
const DAY_NAMES = ["Pondelok","Utorok","Streda","Štvrtok","Piatok","Sobota","Nedeľa"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const todayIdx = (new Date().getDay() + 6) % 7;
let data = null;
let day = todayIdx > 4 ? 4 : todayIdx;

function dateOfWeekday(i) {
  const d = dateForWeekday(i);
  return `${d.getDate()}.${d.getMonth() + 1}.`;
}
function dateForWeekday(i) {
  const d = new Date(); d.setDate(d.getDate() - todayIdx + i);
  return d;
}
const isoDateOfWeekday = i => {
  const d = dateForWeekday(i);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};
const pickKey = i => "pick:" + isoDateOfWeekday(i);
const storedPick = i => JSON.parse(localStorage.getItem(pickKey(i)) || "null");

function migrateLegacyPicks() {
  for (let i = 0; i < 5; i++) {
    const legacyKey = "pick:" + dateOfWeekday(i);
    const legacy = localStorage.getItem(legacyKey);
    if (legacy && !localStorage.getItem(pickKey(i))) {
      localStorage.setItem(pickKey(i), legacy);
      localStorage.removeItem(legacyKey);
    }
  }
}

function highlight(text, q) {
  if (!q) return esc(text);
  const n = norm(text); let out = "", i = 0, at;
  while ((at = n.indexOf(q, i)) !== -1) { out += esc(text.slice(i, at)) + "<mark>" + esc(text.slice(at, at + q.length)) + "</mark>"; i = at + q.length; }
  return out + esc(text.slice(i));
}

function renderTabs() {
  const days = new Set([0,1,2,3,4]);
  data?.restaurants.forEach(r => Object.keys(r.days).forEach(k => days.add(+k)));
  $("#tabs").innerHTML = [...days].sort().map(i =>
    `<button data-d="${i}" class="${i === day ? "active" : ""} ${i === todayIdx ? "today" : ""}">${DAY_NAMES[i].slice(0,2)} <small>${dateOfWeekday(i)}</small></button>`).join("");
}

function renderWeekPlan() {
  $("#week-plan").innerHTML = `<h2>📅 Plán na týždeň</h2>` + [0,1,2,3,4].map(i => {
    const pick = storedPick(i);
    const meal = pick
      ? `<b>${esc(pick.name)}</b> — ${esc(pick.restaurant)}${pick.price ? " · " + esc(pick.price) : ""}`
      : `<span class="none">Nevybraté</span>`;
    return `<div class="plan-day"><button data-plan-day="${i}">${DAY_NAMES[i]} <small>${dateOfWeekday(i)}</small></button><div class="plan-choice"><span>${meal}</span>${pick ? `<button class="remove" data-remove-day="${i}" title="Odstrániť výber">×</button>` : ""}</div></div>`;
  }).join("");
}

function imgBlock(imgs, hint) {
  return `<div class="imgs">${hint ? `<div class="hint">${esc(hint)}</div>` : ""}${imgs.map(im =>
    `<a href="${esc(im.full)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(im.src)}" alt="menu"></a>`).join("")}</div>`;
}

// ---- AI fitness tip: it.ai = {kcal, protein, carbs, fat, fiber, fried, sweet, note} estimated by Gemini
const isSoup = it => /^poliev/i.test(it.category);
const clamp01 = x => Math.max(0, Math.min(1, x));
// 0–100: plenty of protein (and protein share), 450–850 kcal, fat ≤ 30 % of energy, fibre; fried/sweet penalised.
function fitScore(a) {
  const k = a.kcal, pE = a.protein * 4 / k, fE = a.fat * 9 / k;
  const kcal = k < 450 ? clamp01((k - 250) / 200) : k <= 850 ? 1 : clamp01((1250 - k) / 400);
  const s = 35 * clamp01(a.protein / 45) + 20 * clamp01((pE - 0.12) / 0.2) + 20 * kcal
    + 15 * clamp01((0.5 - fE) / 0.2) + 10 * clamp01((a.fiber || 0) / 8)
    - (a.fried ? 15 : 0) - (a.sweet ? 20 : 0);
  return Math.round(Math.max(0, Math.min(100, s)));
}
function bestOf(items) {
  let best = null;
  for (const it of items || []) {
    if (!it.ai || isSoup(it)) continue;
    const s = fitScore(it.ai);
    if (!best || s > best.s) best = {it, s};
  }
  return best;
}
const macros = a => `≈ ${a.kcal} kcal · B ${a.protein} g · S ${a.carbs} g · T ${a.fat} g`;
const scoreTag = s => `<span class="score ${s >= 70 ? "hi" : s >= 50 ? "mid" : ""}" title="Fitness skóre 0–100">${s}</span>`;
const pickId = (r, it) => r.id + "|" + it.category + "|" + it.name;
const pickAttr = (r, it) => esc(JSON.stringify({id: pickId(r, it), name: it.name, price: it.price, restaurant: r.name}));

function renderAi(best, pick) {
  const ranked = data.restaurants.filter(r => best.get(r.id)).sort((a, b) => best.get(b.id).s - best.get(a.id).s);
  $("#ai").style.display = ranked.length ? "block" : "none";
  if (!ranked.length) return;
  $("#ai").innerHTML = `<h3>💪 AI tip pre fitness – ${DAY_NAMES[day].toLowerCase()}</h3>` + ranked.map((r, i) => {
    const {it, s} = best.get(r.id), a = it.ai, date = r.days[day].date;
    const stale = date && date !== dateOfWeekday(day) ? ` <small>(⚠ menu z ${esc(date)})</small>` : "";
    return `<div class="row${pick?.id === pickId(r, it) ? " picked" : ""}" data-pick="${pickAttr(r, it)}" title="Klikni pre výber">
      <span>${i ? "💪" : "🏆"}</span>
      <span><b>${esc(r.name)}:</b> ${esc(it.name)}${it.price ? " · " + esc(it.price) : ""}${stale}
        <span class="macros">${macros(a)}</span>${a.note ? `<span class="why">${esc(a.note)}</span>` : ""}</span>
      ${scoreTag(s)}</div>`;
  }).join("") + `<div class="disc">Hodnoty odhaduje AI (Google Gemini) z názvu jedla a gramáže – sú len orientačné.
    Skóre 0–100 zvýhodňuje veľa bielkovín, 450–850 kcal, menej tukov a vlákninu; vyprážané a sladké jedlá penalizuje, polievky nehodnotí.
    B = bielkoviny, S = sacharidy, T = tuky.</div>`;
}

function render() {
  if (!data) return;
  migrateLegacyPicks();
  renderTabs();
  const q = norm($("#q").value.trim());
  const pick = storedPick(day);
  renderWeekPlan();
  $("#pick").style.display = pick ? "block" : "none";
  if (pick) $("#pick").innerHTML = `⭐ Tvoj výber na ${DAY_NAMES[day].toLowerCase()}: <b>${esc(pick.name)}</b> — ${esc(pick.restaurant)} ${pick.price ? "· " + esc(pick.price) : ""}`;
  const best = new Map(data.restaurants.map(r => [r.id, bestOf(r.days[day]?.items)]));
  renderAi(best, pick);

  $("#list").innerHTML = data.restaurants.map(r => {
    const d = r.days[day];
    const expected = dateOfWeekday(day);
    let body = "";
    if (r.error) body += `<div class="err">Nepodarilo sa načítať: ${esc(r.error)}</div>`;
    if (d && d.date && d.date !== expected) body += `<div class="warn">⚠ Menu je pre ${esc(d.date)} (nie ${expected}) – reštaurácia ho asi ešte neaktualizovala.</div>`;
    const aiRead = r.aiExtracted && d?.items?.length;  // dishes read by AI from the image -> original collapsed
    if (aiRead) body += `<div class="ai-note">🤖 Menu prečítala AI z obrázka – v prípade pochybností over v origináli nižšie.</div>`;
    let items = d?.items || [];
    if (q) items = items.filter(it => norm(it.name + " " + it.note).includes(q));
    if (items.length) {
      body += `<ul>${items.map(it => {
        const a = it.ai, top = best.get(r.id)?.it === it;
        const cls = [isSoup(it) ? "soup" : "", it.category.startsWith("Stála") ? "perm" : "", top ? "best" : "", pick?.id === pickId(r, it) ? "picked" : ""].join(" ");
        const sub = [it.note, it.allergens ? "alergény: " + it.allergens : ""].filter(Boolean).join(" · ");
        const nutr = a ? `<span class="macros" title="${esc(a.note)}">${macros(a)}${isSoup(it) ? "" : " " + scoreTag(fitScore(a))}</span>` : "";
        return `<li class="${cls}" data-pick="${pickAttr(r, it)}" title="Klikni pre výber">
          <span class="cat">${esc(it.category.replace("Stála ponuka · ", "★ "))}</span>
          <span class="name">${highlight(it.name, q)}${top ? `<span class="badge">💪 AI tip</span>` : ""}${sub ? `<span class="sub">${highlight(sub, q)}</span>` : ""}${nutr}</span>
          <span class="price">${esc(it.price)}</span></li>`;
      }).join("")}</ul>`;
    } else if (d?.items?.length && q) {
      body += `<div class="empty">Nič nezodpovedá „${esc($("#q").value)}“.</div>`;
    }
    const imageShown = d?.images?.length || (r.weekImages?.length && !aiRead);
    if (!r.error && !d?.items?.length && !imageShown) body += `<div class="empty">Na tento deň nie je zverejnené menu.</div>`;
    if (d?.images?.length) body += imgBlock(d.images, "Menu je zverejnené ako obrázok – klikni pre zväčšenie.");
    if (r.weekImages?.length) body += aiRead
      ? `<details class="orig"><summary>🖼️ Originálne menu (obrázok)</summary>${imgBlock(r.weekImages, "")}</details>`
      : imgBlock(r.weekImages, "Týždenné menu (obrázok) – klikni pre zväčšenie.");
    return `<section class="card"><h2><a href="${esc(r.url)}" target="_blank">${esc(r.name)} ↗</a><small>${esc(r.period || "")}</small></h2>${body}</section>`;
  }).join("");
}

async function load(refresh) {
  $("#meta").textContent = "Načítavam…";
  try {
    const res = await fetch("menus.json" + (refresh ? "?refresh=1" : `?t=${Date.now()}`), {cache: "no-store"});
    data = await res.json();
    $("#refresh").style.display = data.static ? "none" : "";
    const f = new Date(data.fetchedAt);
    $("#meta").textContent = "Aktualizované " + (f.toDateString() === new Date().toDateString() ? "" : f.toLocaleDateString("sk-SK") + " ")
      + f.toLocaleTimeString("sk-SK", {hour: "2-digit", minute: "2-digit"});
    render();
  } catch (e) {
    $("#meta").textContent = "";
    $("#list").innerHTML = `<div class="err">Chyba pri načítaní: ${esc(e.message)}</div>`;
  }
}

$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { day = +b.dataset.d; render(); } });
$("#q").addEventListener("input", render);
$("#refresh").addEventListener("click", () => load(true));
$("#scroll-left").addEventListener("click", () => $("#list").scrollBy({left: -420, behavior: "smooth"}));
$("#scroll-right").addEventListener("click", () => $("#list").scrollBy({left: 420, behavior: "smooth"}));
document.addEventListener("click", e => {
  const remove = e.target.closest("[data-remove-day]");
  if (remove) {
    localStorage.removeItem(pickKey(+remove.dataset.removeDay));
    render();
    return;
  }
  const planDay = e.target.closest("[data-plan-day]");
  if (planDay) { day = +planDay.dataset.planDay; render(); return; }
  const el = e.target.closest("[data-pick]"); if (!el) return;
  const p = JSON.parse(el.dataset.pick), cur = storedPick(day);
  if (cur?.id === p.id) localStorage.removeItem(pickKey(day)); else localStorage.setItem(pickKey(day), JSON.stringify(p));
  render();
});
load(false);
</script>
</body>
</html>
